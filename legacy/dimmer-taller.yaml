esphome:
  name: "dimmer-taller"
  friendly_name: Dimmer-taller

esp8266:
  board: d1_mini

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Dimmer-Taller Fallback Hotspot"
    password: !secret ap_password

captive_portal:


globals:
   - id: lastDirection
     type: bool
     restore_value: no
     initial_value: 'true'


status_led:
  pin:
    number: GPIO2
    inverted: true

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 1h
    
  - platform: uptime
    name: "Uptime"
    update_interval: 1h

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address
    ssid:
      name: SSID
    mac_address:
      name: MAC          

light:
  - platform: monochromatic
    name: "Esp8266Dimmer"
    id: light_0
    output: light_0_out
    restore_mode: RESTORE_DEFAULT_OFF

# Example output entry
output:
  - platform: esp8266_pwm
    id: light_0_out
    pin: GPIO14
    #inverted: true

binary_sensor:
  - platform: gpio
    pin: 
      number: GPIO13
      inverted: TRUE 
      mode: INPUT_PULLUP
    id: light_0_touch
    on_click:
      then:
        - if:
            condition:
              light.is_off: light_0
            then:
              light.turn_on: 
                id: light_0
                #brightness: 1.0
            else:
              light.turn_off: light_0
    on_press:
      then:
      - if:
          condition: 
            lambda: 'return id(lastDirection) == false;'
          then:
          - delay: 0.5s
          - while:
              condition:
                binary_sensor.is_on: light_0_touch
              then:
                - light.dim_relative:
                    id: light_0
                    relative_brightness: 2%
                    transition_length: 0.2s
                - lambda: 'id(lastDirection) = true;'
                - delay: 0.1s
          else:
          - delay: 0.5s
          - while:
              condition:
                and:
                  - binary_sensor.is_on: light_0_touch
                  - light.is_on: light_0
              then:
                - light.dim_relative:
                    id: light_0
                    relative_brightness: -2%
                    transition_length: 0.2s
                - lambda: 'id(lastDirection) = false;'
                - delay: 0.1s

web_server:
  port: 80
  version: 3
  local: True
            
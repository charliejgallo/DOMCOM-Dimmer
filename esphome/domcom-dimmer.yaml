# DOMCOM Dimmer: Wi-Fi firmware (ESPHome) for the same ESP32-C6 hardware as
# the Zigbee firmware. Same pins and the same behaviour: silent PWM with
# dithering, gamma 2.8 with an adjustable floor, press to toggle, hold to
# dim (alternating direction), and only the BOOT button resets.
#
# See docs/WIFI.md. Needs ESPHome 2026.11 or later and a secrets.yaml with
# the keys listed in secrets.example.yaml.

substitutions:
  name: domcom-dimmer
  friendly_name: DOMCOM Dimmer
  pwm_pin: GPIO18          # MOSFET gate
  button_pin: GPIO19       # push button to GND
  boot_pin: GPIO9          # the board's BOOT button
  pwm_frequency: 19500Hz   # above the audible band (4 kHz hums)
  min_output: "5"          # % at the lowest brightness, until changed in HA
  ramp_time: "4"           # s for a full ramp while holding a button
  reset_hold: 10s          # holding BOOT this long resets Wi-Fi and settings

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: domcom.dimmer
    version: "0.6.0"
  on_boot:
    priority: 600
    then:
      - output.set_min_power:
          id: pwm_out
          min_power: !lambda "return id(min_output_pct) / 100.0f;"

esp32:
  variant: esp32c6
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption: {}           # same key as the API

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret ap_password

captive_portal:

web_server:
  port: 80
  version: 3
  ota: false                 # no unauthenticated firmware upload from the web page

globals:
  - id: min_output_pct
    type: float
    restore_value: true
    initial_value: ${min_output}
  - id: ramp_seconds
    type: float
    restore_value: true
    initial_value: ${ramp_time}
  - id: dim_up               # direction of the last ramp
    type: bool
    restore_value: false
    initial_value: "true"

output:
  - platform: ledc
    id: pwm_out
    pin: ${pwm_pin}
    frequency: ${pwm_frequency}
    dithering: true          # extra resolution at low brightness
    zero_means_zero: true    # off is really off, despite min_power
    min_power: ${min_output}%

light:
  - platform: monochromatic
    id: strip
    name: None               # the device's own name
    output: pwm_out
    gamma_correct: 2.8       # same curve as the Zigbee firmware and ESPHome's default
    default_transition_length: 0.4s
    restore_mode: RESTORE_DEFAULT_OFF
    effects:
      - pulse:
          name: Breathe
          transition_length: 0.5s
          update_interval: 0.5s

script:
  # Hold-to-dim, shared by both buttons. Starts on press; if the button is
  # still held after 0.5 s it ramps until release or the end of the range.
  - id: hold_ramp
    mode: restart
    parameters:
      boot: bool
    then:
      - delay: 500ms
      - if:
          condition:
            lambda: "return boot ? id(boot_button).state : id(main_button).state;"
          then:
            - lambda: |-
                auto v = id(strip).remote_values;
                if (!v.is_on()) {
                  // Off: turn on at the minimum and go up.
                  id(dim_up) = true;
                  auto call = id(strip).turn_on();
                  call.set_brightness(0.01f);
                  call.set_transition_length(0);
                  call.perform();
                } else if (v.get_brightness() >= 0.999f) {
                  id(dim_up) = false;
                } else if (v.get_brightness() <= 0.011f) {
                  id(dim_up) = true;
                } else {
                  id(dim_up) = !id(dim_up);
                }
            - while:
                condition:
                  lambda: "return boot ? id(boot_button).state : id(main_button).state;"
                then:
                  - lambda: |-
                      float step = 0.04f / id(ramp_seconds);
                      float b = id(strip).remote_values.get_brightness();
                      b += id(dim_up) ? step : -step;
                      if (b > 1.0f) b = 1.0f;
                      if (b < 0.01f) b = 0.01f;
                      auto call = id(strip).turn_on();
                      call.set_brightness(b);
                      call.set_transition_length(60);
                      call.perform();
                  - delay: 40ms

  # Holding BOOT for reset_hold (it keeps dimming meanwhile): three blinks,
  # then a factory reset (Wi-Fi credentials and settings), like the Zigbee
  # firmware leaving its network. The external button never resets.
  - id: boot_reset
    mode: restart
    then:
      - delay: ${reset_hold}
      - if:
          condition:
            binary_sensor.is_on: boot_button
          then:
            - repeat:
                count: 3
                then:
                  - light.turn_on:
                      id: strip
                      brightness: 80%
                      transition_length: 0s
                  - delay: 150ms
                  - light.turn_off:
                      id: strip
                      transition_length: 0s
                  - delay: 150ms
            - button.press: factory_reset_button

binary_sensor:
  - platform: gpio
    id: main_button
    name: Button
    internal: true           # a long press dims; it must not trigger automations
    pin:
      number: ${button_pin}
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on_off: 30ms
    on_press:
      - script.execute:
          id: hold_ramp
          boot: false
    on_click:
      min_length: 30ms
      max_length: 499ms
      then:
        - light.toggle: strip

  - platform: gpio
    id: boot_button
    name: BOOT button
    internal: true
    pin:
      number: ${boot_pin}
      inverted: true
      ignore_strapping_warning: true   # only a strapping pin at power-up
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on_off: 30ms
    on_press:
      - script.execute:
          id: hold_ramp
          boot: true
      - script.execute: boot_reset
    on_click:
      min_length: 30ms
      max_length: 499ms
      then:
        - light.toggle: strip

number:
  - platform: template
    name: Minimum output
    icon: mdi:brightness-percent
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 25
    step: 0.1
    mode: box
    lambda: "return id(min_output_pct);"
    set_action:
      - globals.set:
          id: min_output_pct
          value: !lambda "return x;"
      - output.set_min_power:
          id: pwm_out
          min_power: !lambda "return x / 100.0f;"

  - platform: template
    name: Button ramp time
    icon: mdi:timer-outline
    entity_category: config
    unit_of_measurement: s
    min_value: 1
    max_value: 20
    step: 0.1
    mode: box
    lambda: "return id(ramp_seconds);"
    set_action:
      - globals.set:
          id: ramp_seconds
          value: !lambda "return x;"

button:
  - platform: factory_reset
    id: factory_reset_button
    name: Factory reset
    entity_category: config
  - platform: restart
    name: Restart
    entity_category: config

sensor:
  - platform: wifi_signal
    name: Wi-Fi signal
    update_interval: 60s
  - platform: uptime
    name: Uptime
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP address
  - platform: version
    name: ESPHome version

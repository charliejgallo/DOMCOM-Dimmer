# Copy to secrets.yaml (not in git) and fill in. In the ESPHome Device
# Builder, put these keys in its own secrets instead.
wifi_ssid: "your-network"
wifi_password: "your-wifi-password"
ap_password: "fallback-hotspot-password"
# 32 random bytes in base64 (API and OTA), e.g.: openssl rand -base64 32
api_encryption_key: "REPLACE_WITH_32_BYTES_BASE64="
